<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#D41367">
    <title>Bestelling ontvangen | Rotaract Gaasbeek Pajottenland</title>
    <link rel="icon" href="/assets/images/favicon-48.png" type="image/png" sizes="48x48">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <main id="main">
      <section class="page-hero">
        <div class="page-hero__image">
          <img src="assets/images/photos/main-club-photo.jpg" alt="Rotaract Gaasbeek Pajottenland">
        </div>
        <div class="page-hero__content">
          <div class="page-hero__body">
            <p class="eyebrow">Bestelling ontvangen</p>
            <h1 class="page-title">Bedankt voor je bestelling.</h1>
            <p class="lead">Stripe verwerkt je betaling. Door een technisch probleem verwerken we de ticketbevestigingen vandaag manueel.</p>
            <p class="form-status" role="status" aria-live="polite" data-confirm-status>We controleren je betaling. Toon deze pagina gerust aan de kassa indien nodig.</p>
            <div class="hero__actions">
              <a class="button button--primary" href="index.html">Naar home</a>
              <a class="button button--secondary" href="events.html">Bekijk events</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const status = document.querySelector("[data-confirm-status]");
        const sessionId = new URLSearchParams(window.location.search).get("session_id");

        if (!status || !sessionId) return;

        let attempts = 0;
        const maxPendingAttempts = 90;
        const maxErrorAttempts = 12;

        const confirmPayment = async () => {
          attempts += 1;

          try {
            const response = await fetch("/api/confirm-checkout", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ sessionId }),
            });
            const result = await response.json().catch(() => ({}));

            if (response.status === 202 || result.pending) {
              if (attempts < maxPendingAttempts) {
                status.textContent = "Je betaling wordt nog bevestigd. We controleren opnieuw...";
                setTimeout(confirmPayment, 4000);
                return;
              }

              status.textContent = "Je betaling wordt nog verwerkt. Je ontvangt je bevestiging zodra Stripe de betaling bevestigt.";
              return;
            }

            if (!response.ok || !result.ok) {
              throw new Error(result.message || "De bevestiging kon nog niet worden verwerkt.");
            }

            if (result.manualProcessing) {
              status.textContent = "Je betaling is bevestigd. We verwerken je ticketbevestiging manueel.";
              status.classList.remove("form-status--error");
              return;
            }

            status.textContent = "Je betaling is bevestigd.";
            status.classList.remove("form-status--error");
          } catch (error) {
            if (attempts < maxErrorAttempts) {
              status.textContent = "We proberen je bevestiging opnieuw te verwerken...";
              setTimeout(confirmPayment, 5000);
              return;
            }

            status.textContent =
              error.message ||
              "Je betaling is ontvangen, maar de bevestigingsmail kon nog niet automatisch worden verwerkt.";
            status.classList.add("form-status--error");
          }
        };

        confirmPayment();
      })();
    </script>
  </body>
</html>
